    - resource:it-miljo/tjanst
    - resource:it-miljo/tjanst-operativ
    - component:it-miljo/exponeringsplattform
    - component:it-miljo/api-gateway-extern
    - component:it-miljo/containerplattform
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: tagplan-http
spec:
  type: openapi
  lifecycle: experimental
  owner: group:it-miljo/team-forvaltning-planering
  system: tagplan
  definition: |
    {
      "openapi": "3.0.3",
      "info": {
        "title": "Tågplan",
        "version": "2.0.0"
      },
      "paths": {
        "/plans": {
          "get": {
            "summary": "Lista tåg",
            "responses": {
              "200": {
                "description": "OK"
              }
            }
          },
          "post": {
            "summary": "Skapa och distribuera tågplan",
            "responses": {
              "200": {
                "description": "OK"
              }
            }
          }
        },
        "/plans/{trainId}": {
          "get": {
            "summary": "Visa tåg",
            "responses": {
              "200": {
                "description": "OK"
              }
            }
          }
        },
        "/integrations": {
          "get": {
            "summary": "Integrationshistorik",
            "responses": {
              "200": {
                "description": "OK"
              }
            }
          }
        },
        "/plans/{trainId}/distribute": {
          "post": {
            "summary": "Distribuera lagrad plan",
            "responses": {
              "200": {
                "description": "OK"
              }
            }
          }
        }
      },
      "components": {
        "securitySchemes": {
          "bearerAuth": {
            "type": "http",
            "scheme": "bearer",
            "bearerFormat": "JWT"
          }
        }
      },
      "security": [
        {
          "bearerAuth": []
        }
      ]
    }
---
