# Fem exempelsystem i katalogen, som en organisations egna system. De placerar sig
# i IT-miljön genom annotationen architecture.portal/segment och anger vad de bygger
# på med hela referensen in i namespace it-miljo. Kedjan: tågplanen lämnas till
# planerad annonsering och tågläge, trafikinformationen samlar båda, och det öppna
# trafik-API:et exponerar den mot internet.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: tagplan
  title: Tågplan
  description: Lägger tågplanen och lämnar den till annonseringen och tågläget.
spec:
  owner: group:it-miljo/team-forvaltning-planering
  domain: domain:it-miljo/planering
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: annonsering
  title: Planerad annonsering
  description: Gör tågplanen till planerad annonsering.
spec:
  owner: group:it-miljo/team-forvaltning-trafikinformation
  domain: domain:it-miljo/trafikinformation
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: taglage
  title: Tågläge
  description: Aktuellt tågläge och förseningar.
spec:
  owner: group:it-miljo/team-forvaltning-trafikledning
  domain: domain:it-miljo/trafikledning
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: trafikinformation
  title: Trafikinformation
  description: Samlad trafikinformation ur planerad annonsering och aktuellt tågläge.
spec:
  owner: group:it-miljo/team-forvaltning-trafikinformation
  domain: domain:it-miljo/trafikinformation
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: oppet-trafik-api
  title: Öppet trafik-API
  description: Trafikinformation som öppet API mot internet.
spec:
  owner: group:it-miljo/team-forvaltning-trafikinformation
  domain: domain:it-miljo/trafikinformation
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: tagplan
  title: Tågplan
  description: Tar emot tågplaner och skickar dem till Planerad annonsering och Tågläge.
  tags:
    - verksamhetssystem
    - sqlite
  annotations:
    architecture.portal/segment: tjanst-container
spec:
  type: service
  lifecycle: experimental
  owner: group:it-miljo/team-forvaltning-planering
  system: tagplan
  providesApis:
    - tagplan-http
  consumesApis:
    - annonsering-http
    - taglage-http
  dependsOn:
    - component:annonsering
    - component:taglage
    - resource:tagplan-db
    - resource:it-miljo/tjanst
    - resource:it-miljo/tjanst-container
    - component:it-miljo/api-gateway-intern
    - component:it-miljo/inloggningstjanst
    - component:it-miljo/containerplattform
    - component:it-miljo/databasplattform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: annonsering
  title: Planerad annonsering
  description: Skickar planerad annonsering till Trafikinformation.
  tags:
    - verksamhetssystem
    - nunjucks
    - sqlite
  annotations:
    architecture.portal/segment: tjanst-operativ
spec:
  type: service
  lifecycle: experimental
  owner: group:it-miljo/team-forvaltning-trafikinformation
  system: annonsering
  providesApis:
    - annonsering-http
  consumesApis:
