id: TP-GRU-03
kind: technical-principle
title: Bygget och driftsättningen är beskrivna i repot
binding: recommended
topic: Grunden
statement: Byggsteg, tester, konfiguration och driftsättning ligger som filer i samma repo som koden, med logiken i skript som pipelinen anropar i stället för i plattformens egen konfiguration. Det som inte går att skripta — konton, brandväggsöppningar, poster hos lastbalanserare, certifikat — är listat i repot, med vem som utför det.
rationale: En pipeline som klickats ihop i plattformens gränssnitt finns bara i plattformens databas. Den går inte att granska, diffa, pröva i en branch eller rulla tillbaka — ändringar av hur systemet byggs och driftsätts passerar alltså inte grindarna som TP-FLO-04, TP-FLO-06 och TP-FLO-05 vilar på, fastän de avgör vad som hamnar i produktion. Och det som varken ligger i repot eller i ett skript finns bara hos den som gjorde det senast, vilket gör en återställning enligt TP-DRI-14 till utgrävning. Att lägga stegen i skript kostar nästan ingenting när pipelinen ändå ska skrivas.
scope: System som byggs och driftsätts genom en pipeline. En pipeline som redan är konfigurerad i plattformens gränssnitt omfattas först när den ändras eller byggs om.
preconditions: '[Eventuell text mellan motiveringen och möjliga lösningar i TP-GRU-03 syns inte i bilderna.]'
solutions: 'Pipelinen definierad som filer i repot i stället för i plattformens grafiska redigerare, med stegens logik i skript den anropar, så att de går att läsa, felsöka och köra styckvis utanför den; infrastruktur som kod (TP-GRU-01) för det som går att provisionera automatiskt; en kort resurslista i repot — även köer och kataloger — med vem som skapar varje post. En lista åldras långsammare än löpande text. Skriv beroendet, inte konfigurationen: att systemet behöver en väg från ett segment till ett annat och vem som beställer den — inte adresser, portar eller regel-ID. Det är inventeringen som behövs för att återskapa systemet, och detaljerna förvaltas där de hör hemma.'
ifNotMet: Huvudregel — vad det innebär. En pipeline som redan är konfigurerad i plattformens gränssnitt föregår posten och är inget avsteg; den konverteras när den ändå ska ändras, inte som ett eget projekt. Avsteget uppstår först när ni skriver en ny pipeline i gränssnittet, eller bygger om en befintlig och lämnar kvar den där — dokumentera det i så fall som en ADR (TP-SAM-26).
